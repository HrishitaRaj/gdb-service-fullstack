server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

logging:
  level:
    root: INFO
    com.gdb.transactions: INFO

  file:
    name: logs/transactions-service.log
    max-size: 10MB
    max-history: 30

external:
  account-service:
    url: ${ACCOUNT_SERVICE_URL}
    timeout: 10000

    retry:
      max-attempts: 3
      delay: 1000

  payment-gateway-service:
    url: ${PAYMENT_GATEWAY_SERVICE_URL}
    timeout: 10000