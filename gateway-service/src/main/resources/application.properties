spring.application.name=gateway-service

server.port=8000

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8004
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=users-service
spring.cloud.gateway.routes[1].uri=http://localhost:8003
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**

spring.cloud.gateway.routes[2].id=account-service
spring.cloud.gateway.routes[2].uri=http://localhost:8001
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/accounts/**

spring.cloud.gateway.routes[3].id=transactions-service
spring.cloud.gateway.routes[3].uri=http://localhost:8002
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/transactions/**